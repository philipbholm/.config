model = "gpt-5.5"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
# notifications disabled — re-enable by restoring:
# notify = ["/Users/philip/.config/dev/codex-notify.sh"]
notify = []

[projects."/Users/philip/work/ledidi-monorepo"]
trust_level = "trusted"

[projects."/Users/philip/.config"]
trust_level = "trusted"

[projects."/Users/philip/work/.dev-stacks"]
trust_level = "trusted"

[projects."/Users/philip/work/scripts"]
trust_level = "trusted"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--browserUrl", "http://127.0.0.1:9222", "--isolated"]

[mcp_servers.datadog]
command = "/Users/philip/.config/dev/mcp-datadog.sh"

[notice]
hide_rate_limit_model_nudge = true
fast_default_opt_out = true

[tui]
notifications = false
status_line = ["context-used", "used-tokens", "current-dir", "model", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[plugins."superpowers@openai-curated"]
enabled = true
