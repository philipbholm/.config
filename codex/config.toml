# model + model_reasoning_effort are deliberately not tracked — Codex writes the
# runtime choice into the live ~/.codex/config.toml, which is machine-local.
personality = "pragmatic"
notify = ["/Users/philip/.config/dev/codex-notify.sh"]

[projects."/Users/philip/.config"]
trust_level = "trusted"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--browserUrl", "http://127.0.0.1:9222"]

[notice]
hide_rate_limit_model_nudge = true
fast_default_opt_out = true

[tui]
notifications = false
status_line = ["context-used", "used-tokens", "current-dir", "model", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
